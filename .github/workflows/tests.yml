name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            pest: '^2.0'
            pestLaravel: '^2.0'
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pestLaravel: '^4.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            pestLaravel: '^4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Allow EOL Laravel installs (advisory block bypass, CI only)
        if: matrix.laravel == '^10.0' || matrix.laravel == '^11.0'
        run: composer config policy.advisories.block false

      - name: Pin framework version
        run: >
          composer require --no-interaction --no-update
          "laravel/framework:${{ matrix.laravel }}"

      - name: Pin dev tool versions
        run: >
          composer require --dev --no-interaction --no-update
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "pestphp/pest-plugin-laravel:${{ matrix.pestLaravel }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
